<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>兼容版-组件嵌套与Props传参</title>
    <style>
        .box {
            margin: 10px;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .root {
            background: #f8f9fa;
        }

        .child {
            background: #fff;
        }

        .grandson {
            background: #f1f1f1;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script src="./mini-solid-vue.js"></script>
    <script>
        const { defineComponent, renderComponent, createSignal } = MiniSolidVue;

        // 根组件：承载所有层级结构，使用原生DOM实现嵌套
        defineComponent('Root', {
            setup() {
                // 定义跨层级传递的数据
                const [rootText] = createSignal('跨层级传递的数据');
                const [childTitle] = createSignal('子组件标题');
                return {
                    rootText,
                    childTitle
                };
            },
            // 全部使用原生HTML标签，替代不支持的自定义组件标签
            template: `
        <div class="box root">
          <div>根组件</div>
          <!-- 子组件层级 -->
          <div class="box child">
            <div>子组件：{{ childTitle() }}</div>
            <!-- 孙子组件层级 -->
            <div class="box grandson">孙子组件：{{ rootText() }}</div>
          </div>
        </div>
      `
        })

        // 渲染根组件
        renderComponent('Root', {}, document.getElementById('app'))
    </script>
</body>

</html>
