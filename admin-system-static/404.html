<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        .not-found {
            text-align: center;
            padding-top: 100px;
        }

        .not-found h1 {
            font-size: 100px;
            color: #409eff;
            margin: 0;
        }

        .not-found p {
            font-size: 20px;
            color: #666;
            margin: 20px 0;
        }

        .not-found a {
            display: inline-block;
            padding: 10px 20px;
            background: #409eff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="not-found">
        <h1>404</h1>
        <p>抱歉，你访问的页面不存在</p>
        <a href="index.html">返回首页</a>
    </div>
</body>

</html>
