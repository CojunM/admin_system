<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表 - 后台管理系统</title>
    <!-- 引入 Element Plus CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #app {
            height: 100%;
        }

        .el-header {
            background-color: #fff;
            color: #333;
            line-height: 60px;
            border-bottom: 1px solid #e6e6e6;
            text-align: right;
            padding-right: 20px;
        }

        .el-aside {
            color: #333;
            background-color: #2e3b4e;
        }

        .el-menu {
            border-right: none;
        }

        .el-main {
            padding: 20px;
            background-color: #f5f5f5;
        }

        .search-form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .table-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="app">
        <el-container style="height: 100%;">
            <!-- 侧边栏 -->
            <el-aside width="200px">
                <el-menu default-active="2-1" class="el-menu-vertical-demo" background-color="#2e3b4e" text-color="#fff"
                    active-text-color="#ffd04b" :collapse="isCollapse">
                    <el-menu-item index="1" @click="navigateTo('index.html')">
                        <el-icon>
                            <House />
                        </el-icon>
                        <template #title>首页</template>
                    </el-menu-item>
                    <el-sub-menu index="2">
                        <template #title>
                            <el-icon>
                                <User />
                            </el-icon>
                            <span>用户管理</span>
                        </template>
                        <el-menu-item index="2-1" @click="navigateTo('user-list.html')">用户列表</el-menu-item>
                    </el-sub-menu>
                </el-menu>
            </el-aside>

            <el-container>
                <!-- 顶部导航 -->
                <el-header>
                    <el-button type="text" @click="isCollapse = !isCollapse" style="margin-right: 20px;">
                        <el-icon>
                            <Shrink />
                        </el-icon>
                    </el-button>
                    <el-dropdown>
                        <span>
                            管理员
                            <el-icon>
                                <ArrowDown />
                            </el-icon>
                        </span>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item @click="handleLogout">退出登录</el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </el-header>

                <!-- 主内容区 -->
                <el-main>
                    <!-- 搜索表单 -->
                    <div class="search-form">
                        <el-form :inline="true" :model="searchForm" class="demo-form-inline">
                            <el-form-item label="用户名">
                                <el-input v-model="searchForm.username" placeholder="请输入用户名"></el-input>
                            </el-form-item>
                            <el-form-item label="状态">
                                <el-select v-model="searchForm.status" placeholder="请选择状态">
                                    <el-option label="启用" value="1"></el-option>
                                    <el-option label="禁用" value="0"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="handleSearch">查询</el-button>
                                <el-button @click="resetSearch">重置</el-button>
                            </el-form-item>
                            <el-form-item style="float: right;">
                                <el-button type="primary" @click="handleAdd">新增用户</el-button>
                            </el-form-item>
                        </el-form>
                    </div>

                    <!-- 数据表格 -->
                    <el-card class="table-card">
                        <el-table :data="tableData" border style="width: 100%">
                            <el-table-column prop="id" label="ID" width="80"></el-table-column>
                            <el-table-column prop="username" label="用户名"></el-table-column>
                            <el-table-column prop="phone" label="手机号"></el-table-column>
                            <el-table-column prop="email" label="邮箱"></el-table-column>
                            <el-table-column prop="createTime" label="创建时间"></el-table-column>
                            <el-table-column prop="status" label="状态">
                                <template #default="scope">
                                    <el-tag v-if="scope.row.status === 1" type="success">启用</el-tag>
                                    <el-tag v-else type="danger">禁用</el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" width="200">
                                <template #default="scope">
                                    <el-button size="small" type="primary" @click="handleEdit(scope.row)">编辑</el-button>
                                    <el-button size="small" type="danger"
                                        @click="handleDelete(scope.row)">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>

                        <!-- 分页 -->
                        <el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange"
                            :current-page="currentPage" :page-sizes="[10, 20, 50, 100]" :page-size="pageSize"
                            layout="total, sizes, prev, pager, next, jumper" :total="total"
                            style="margin-top: 20px; text-align: right;">
                        </el-pagination>
                    </el-card>
                </el-main>
            </el-container>
        </el-container>

        <!-- 新增/编辑弹窗 -->
        <el-dialog v-model="dialogVisible" title="用户编辑" width="500px">
            <el-form :model="form" label-width="80px">
                <el-form-item label="用户名">
                    <el-input v-model="form.username"></el-input>
                </el-form-item>
                <el-form-item label="手机号">
                    <el-input v-model="form.phone"></el-input>
                </el-form-item>
                <el-form-item label="邮箱">
                    <el-input v-model="form.email"></el-input>
                </el-form-item>
                <el-form-item label="状态">
                    <el-radio v-model="form.status" label="1">启用</el-radio>
                    <el-radio v-model="form.status" label="0">禁用</el-radio>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="handleSave">保存</el-button>
                </span>
            </template>
        </el-dialog>
    </div>

    <script>
        const { createApp, ref, onMounted, reactive } = Vue
        const { ElMessage, ElMessageBox } = ElementPlus

        createApp({
            setup() {
                const isCollapse = ref(false)
                const dialogVisible = ref(false)
                const currentPage = ref(1)
                const pageSize = ref(10)
                const total = ref(50)

                // 搜索表单
                const searchForm = reactive({
                    username: '',
                    status: ''
                })

                // 编辑表单
                const form = reactive({
                    id: '',
                    username: '',
                    phone: '',
                    email: '',
                    status: '1'
                })

                // 模拟表格数据
                const tableData = ref([
                    { id: 1, username: 'zhangsan', phone: '13800138000', email: 'zhangsan@example.com', createTime: '2026-01-01', status: 1 },
                    { id: 2, username: 'lisi', phone: '13800138001', email: 'lisi@example.com', createTime: '2026-01-02', status: 1 },
                    { id: 3, username: 'wangwu', phone: '13800138002', email: 'wangwu@example.com', createTime: '2026-01-03', status: 0 }
                ])

                // 页面加载时验证登录状态
                onMounted(() => {
                    const isLogin = localStorage.getItem('isLogin')
                    if (!isLogin) {
                        window.location.href = 'login.html'
                    }
                })

                // 页面跳转
                const navigateTo = (url) => {
                    window.location.href = url
                }

                // 退出登录
                const handleLogout = () => {
                    localStorage.removeItem('isLogin')
                    ElMessage.success('退出成功！')
                    window.location.href = 'login.html'
                }

                // 搜索
                const handleSearch = () => {
                    ElMessage.info('执行搜索操作，可对接后端接口实现真实搜索')
                }

                // 重置搜索
                const resetSearch = () => {
                    searchForm.username = ''
                    searchForm.status = ''
                }

                // 新增用户
                const handleAdd = () => {
                    form.id = ''
                    form.username = ''
                    form.phone = ''
                    form.email = ''
                    form.status = '1'
                    dialogVisible.value = true
                }

                // 编辑用户
                const handleEdit = (row) => {
                    form.id = row.id
                    form.username = row.username
                    form.phone = row.phone
                    form.email = row.email
                    form.status = row.status + ''
                    dialogVisible.value = true
                }

                // 删除用户
                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        '此操作将永久删除该用户, 是否继续?',
                        '提示',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        // 模拟删除
                        tableData.value = tableData.value.filter(item => item.id !== row.id)
                        ElMessage.success('删除成功!')
                    }).catch(() => {
                        ElMessage.info('已取消删除')
                    })
                }

                // 保存用户
                const handleSave = () => {
                    if (form.id) {
                        // 编辑
                        const index = tableData.value.findIndex(item => item.id === form.id)
                        if (index > -1) {
                            tableData.value[index] = {
                                ...tableData.value[index],
                                username: form.username,
                                phone: form.phone,
                                email: form.email,
                                status: parseInt(form.status)
                            }
                        }
                        ElMessage.success('编辑成功!')
                    } else {
                        // 新增
                        const newId = Math.max(...tableData.value.map(item => item.id)) + 1
                        tableData.value.unshift({
                            id: newId,
                            username: form.username,
                            phone: form.phone,
                            email: form.email,
                            createTime: new Date().toLocaleDateString(),
                            status: parseInt(form.status)
                        })
                        ElMessage.success('新增成功!')
                    }
                    dialogVisible.value = false
                }

                // 分页相关
                const handleSizeChange = (val) => {
                    pageSize.value = val
                    ElMessage.info(`每页显示 ${val} 条`)
                }
                const handleCurrentChange = (val) => {
                    currentPage.value = val
                    ElMessage.info(`当前页: ${val}`)
                }

                return {
                    isCollapse,
                    dialogVisible,
                    searchForm,
                    tableData,
                    form,
                    currentPage,
                    pageSize,
                    total,
                    navigateTo,
                    handleLogout,
                    handleSearch,
                    resetSearch,
                    handleAdd,
                    handleEdit,
                    handleDelete,
                    handleSave,
                    handleSizeChange,
                    handleCurrentChange
                }
            }
        }).use(ElementPlus).mount('#app')
    </script>
</body>

</html>
