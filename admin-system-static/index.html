<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 后台管理系统</title>
    <!-- 引入 Element Plus CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #app {
            height: 100%;
        }

        .el-header {
            background-color: #fff;
            color: #333;
            line-height: 60px;
            border-bottom: 1px solid #e6e6e6;
            text-align: right;
            padding-right: 20px;
        }

        .el-aside {
            color: #333;
            background-color: #2e3b4e;
        }

        .el-menu {
            border-right: none;
        }

        .el-main {
            padding: 20px;
            background-color: #f5f5f5;
        }

        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .stat-card p {
            color: #666;
            margin: 0 0 10px 0;
        }

        .stat-card h3 {
            font-size: 24px;
            margin: 0;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="app">
        <el-container style="height: 100%;">
            <!-- 侧边栏 -->
            <el-aside width="200px">
                <el-menu default-active="1" class="el-menu-vertical-demo" background-color="#2e3b4e" text-color="#fff"
                    active-text-color="#ffd04b" :collapse="isCollapse" router>
                    <el-menu-item index="1" @click="navigateTo('index.html')">
                        <el-icon>
                            <House />
                        </el-icon>
                        <template #title>首页</template>
                    </el-menu-item>
                    <el-sub-menu index="2">
                        <template #title>
                            <el-icon>
                                <User />
                            </el-icon>
                            <span>用户管理</span>
                        </template>
                        <el-menu-item index="2-1" @click="navigateTo('user-list.html')">用户列表</el-menu-item>
                    </el-sub-menu>
                </el-menu>
            </el-aside>

            <el-container>
                <!-- 顶部导航 -->
                <el-header>
                    <el-button type="text" @click="isCollapse = !isCollapse" style="margin-right: 20px;">
                        <el-icon>
                            <Shrink />
                        </el-icon>
                    </el-button>
                    <el-dropdown>
                        <span>
                            管理员
                            <el-icon>
                                <ArrowDown />
                            </el-icon>
                        </span>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item @click="handleLogout">退出登录</el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </el-header>

                <!-- 主内容区 -->
                <el-main>
                    <el-row :gutter="20">
                        <el-col :span="6">
                            <div class="stat-card">
                                <p>总用户数</p>
                                <h3>1258</h3>
                            </div>
                        </el-col>
                        <el-col :span="6">
                            <div class="stat-card">
                                <p>今日新增</p>
                                <h3>28</h3>
                            </div>
                        </el-col>
                        <el-col :span="6">
                            <div class="stat-card">
                                <p>订单数</p>
                                <h3>896</h3>
                            </div>
                        </el-col>
                        <el-col :span="6">
                            <div class="stat-card">
                                <p>销售额</p>
                                <h3>¥125,689</h3>
                            </div>
                        </el-col>
                    </el-row>
                </el-main>
            </el-container>
        </el-container>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue
        const { ElMessage } = ElementPlus

        createApp({
            setup() {
                const isCollapse = ref(false)

                // 页面加载时验证登录状态
                onMounted(() => {
                    const isLogin = localStorage.getItem('isLogin')
                    if (!isLogin) {
                        window.location.href = 'login.html'
                    }
                })

                // 页面跳转
                const navigateTo = (url) => {
                    window.location.href = url
                }

                // 退出登录
                const handleLogout = () => {
                    localStorage.removeItem('isLogin')
                    ElMessage.success('退出成功！')
                    window.location.href = 'login.html'
                }

                return {
                    isCollapse,
                    navigateTo,
                    handleLogout
                }
            }
        }).use(ElementPlus).mount('#app')
    </script>
</body>

</html>
